[package]
name = "memoized-dom-desktop-window"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
memoized-dom-desktop-host = { path = ".." }
gpui = { git = "https://github.com/zed-industries/zed", rev = "9ab0715969e9854f2efe61a9d782e7698e5fe6d2", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "9ab0715969e9854f2efe61a9d782e7698e5fe6d2", default-features = false }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cssparser = "0.37"
unicode-segmentation = "1"
csscolorparser = "0.8.3"
taffy = { version = "=0.13.0", default-features = false, features = ["parse"] }

[profile.dev]
debug = 0

# Keep native layout responsive in development as the authored scene grows.
[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.gpui]
opt-level = 2

[profile.dev.package.memoized-dom-desktop-window]
opt-level = 2
