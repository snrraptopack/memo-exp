<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fieldnotes</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: ui-serif, Georgia, 'Times New Roman', serif;
        background: #f5f1e8;
        color: #2b2620;
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }
      header.app {
        display: flex; align-items: baseline; justify-content: space-between;
        flex-wrap: wrap; gap: 0.5rem;
        border-bottom: 2px solid #2b2620;
        padding-bottom: 1rem; margin-bottom: 1.5rem;
      }
      header.app h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.02em; }
      nav { display: flex; gap: 0.4rem; }
      nav a {
        color: #2b2620; text-decoration: none; font-weight: 500;
        font-family: system-ui, sans-serif; font-size: 0.85rem;
        padding: 0.3rem 0.8rem; border: 1px solid #2b2620; border-radius: 999px;
        transition: background 0.15s, color 0.15s;
      }
      nav a:hover { background: #2b2620; color: #f5f1e8; }
      .card {
        background: #fffdf7;
        border: 1px solid #ddd3bd; border-radius: 8px;
        padding: 1.1rem 1.25rem; margin-bottom: 1rem;
        box-shadow: 0 1px 3px rgba(43, 38, 32, 0.08);
      }
      .card h2, .card h3 { margin-top: 0; }
      ul.plain { list-style: none; padding: 0; margin: 0; }
      .expedition {
        display: block; padding: 0.7rem 0.9rem; margin-bottom: 0.5rem;
        background: #fffdf7; border: 1px solid #ddd3bd; border-radius: 8px;
        transition: border-color 0.15s, transform 0.1s;
      }
      .expedition:hover { border-color: #2b2620; transform: translateX(2px); }
      .expedition a { color: #1d5b39; font-weight: 600; text-decoration: none; }
      .expedition a:hover { text-decoration: underline; }
      .meta { font-family: system-ui, sans-serif; font-size: 0.78rem; color: #7a6f5d; }
      .chip {
        display: inline-block; padding: 0.05rem 0.5rem; border-radius: 999px;
        background: #ece5d3; font-family: system-ui, sans-serif; font-size: 0.72rem;
      }
      .badge {
        display: inline-flex; align-items: center; gap: 0.3rem;
        padding: 0.15rem 0.65rem; border-radius: 999px;
        font-family: system-ui, sans-serif; font-size: 0.78rem; font-weight: 600;
      }
      .badge-ok { background: #d9f0e0; color: #1d5b39; }
      .badge-down { background: #f6dcd2; color: #8c3a20; }
      .pending { color: #8a6d00; }
      .error { color: #a12626; }
      .muted { color: #7a6f5d; font-size: 0.85rem; }
      button {
        font-family: system-ui, sans-serif; font-size: 0.82rem;
        padding: 0.35rem 0.85rem; border-radius: 6px; cursor: pointer;
        border: 1px solid #2b2620; background: #fffdf7; color: #2b2620;
        transition: background 0.15s, color 0.15s;
      }
      button:hover { background: #2b2620; color: #f5f1e8; }
      button:disabled { opacity: 0.5; cursor: default; }
      .note-form { display: flex; gap: 0.5rem; margin: 1rem 0; }
      .note-form input {
        flex: 1; padding: 0.5rem 0.7rem; font-family: inherit;
        border: 1px solid #ddd3bd; border-radius: 6px; background: #fffdf7;
      }
      .note-form input:focus { outline: 2px solid #1d5b39; border-color: #1d5b39; }
      .note {
        padding: 0.6rem 0.9rem; margin-bottom: 0.45rem;
        background: #faf6ec; border-left: 3px solid #1d5b39; border-radius: 4px;
      }
      .note button { font-size: 0.7rem; padding: 0.1rem 0.45rem; margin-left: 0.5rem; }
      .status-line { font-family: system-ui, sans-serif; font-size: 0.82rem; }
      .spinner {
        display: inline-block; width: 0.8em; height: 0.8em;
        border: 2px solid #ddd3bd; border-top-color: #8a6d00;
        border-radius: 50%; animation: spin 0.7s linear infinite;
        vertical-align: -0.1em;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      a.back { color: #1d5b39; font-family: system-ui, sans-serif; font-size: 0.82rem; }
    </style>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
