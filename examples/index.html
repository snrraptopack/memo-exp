<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ Memoized DOM - Todo App</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --done-text: #64748b;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .todo-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    h1 {
      margin: 0 0 0.25rem 0;
      font-size: 1.75rem;
      color: var(--primary);
    }
    .subtitle {
      margin: 0 0 1.5rem 0;
      color: var(--subtext);
      font-size: 0.9rem;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    button:hover {
      background: var(--primary-hover);
      color: #fff;
    }
    button:active {
      transform: scale(0.97);
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .todo-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1.05rem;
      user-select: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .todo-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .todo-item.done {
      text-decoration: line-through;
      color: var(--done-text);
      background: rgba(255, 255, 255, 0.02);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./dist/todo-bundle.js"></script>
</body>
</html>
