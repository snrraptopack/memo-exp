<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>⚡ Memoized DOM - Example Applications</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --subtext: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 2rem 1rem;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    .cart-app-container, .dashboard-container {
      width: 100%;
      max-width: 960px;
    }
    .app-header, .dashboard-header {
      margin-bottom: 2rem;
      text-align: center;
    }
    .app-header h1, .dashboard-header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.85rem;
      color: var(--primary);
    }
    .app-subtitle {
      margin: 0 0 1.5rem 0;
      color: var(--subtext);
      font-size: 0.95rem;
    }
    .category-filters, .dashboard-tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .filter-btn, .add-item-btn, .tab-btn, .live-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--subtext);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active, .tab-btn.active {
      background: var(--primary);
      color: #0b0f19;
      border-color: var(--primary);
    }
    .live-toggle-btn.active {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent);
      border-color: var(--accent);
    }
    .add-item-btn {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }
    .add-item-btn:hover {
      background: rgba(16, 185, 129, 0.3);
    }
    
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.5rem;
    }
    @media (max-width: 768px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }
    }

    .cart-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .cart-item-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .item-icon {
      font-size: 1.6rem;
    }
    .item-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .item-name {
      font-weight: 600;
      font-size: 1.05rem;
    }
    .item-meta {
      font-size: 0.85rem;
      color: var(--subtext);
    }
    .item-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .qty-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px 8px;
      border-radius: 8px;
    }
    .btn-qty {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-qty:hover {
      background: var(--primary);
      color: #000;
    }
    .qty-val {
      font-weight: 600;
      min-width: 20px;
      text-align: center;
    }
    .line-total {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary);
      min-width: 60px;
      text-align: right;
    }
    .btn-remove {
      background: transparent;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.15s ease;
    }
    .btn-remove:hover {
      opacity: 1;
    }

    .order-summary-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .order-summary-card h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.25rem;
      color: var(--text);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      color: var(--subtext);
    }
    .summary-row.discount {
      color: var(--accent);
      font-weight: 600;
    }
    .summary-row.total {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }
    .summary-divider {
      height: 1px;
      background: var(--card-border);
      margin: 0.25rem 0;
    }
    .shipping-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 0.5rem;
    }
    .shipping-section label {
      font-size: 0.85rem;
      color: var(--subtext);
    }
    .shipping-options {
      display: flex;
      gap: 8px;
    }
    .shipping-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--subtext);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .shipping-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }
    .promo-section {
      margin-top: 0.5rem;
    }
    .promo-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed var(--subtext);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .promo-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Dashboard Styles */
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 6px;
    }
    .status-badge.healthy {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-badge.degraded {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .metric-card-header h3 {
      margin: 0;
      font-size: 0.95rem;
      color: var(--subtext);
    }
    .metric-card-header .subtitle {
      font-size: 0.75rem;
      color: var(--primary);
      font-weight: bold;
    }
    .metric-value {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .metric-value .num {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text);
    }
    .metric-value .unit {
      font-size: 0.9rem;
      color: var(--subtext);
    }

    .logs-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
    }
    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .logs-header h3 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--text);
    }
    .btn-clear {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .logs-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
    }
    .log-item {
      font-family: monospace;
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      gap: 12px;
    }
    .log-item.info { color: #38bdf8; }
    .log-item.warn { color: #f59e0b; }
    .log-item.error { color: #f87171; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/entry.ts"></script>
</body>
</html>
