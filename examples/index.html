<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>⚡ Memoized DOM - Incident Composition Board</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --subtext: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 2rem 1rem;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    .cart-app-container, .dashboard-container {
      width: 100%;
      max-width: 960px;
    }
    .app-header, .dashboard-header {
      margin-bottom: 2rem;
      text-align: center;
    }
    .app-header h1, .dashboard-header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.85rem;
      color: var(--primary);
    }
    .app-subtitle {
      margin: 0 0 1.5rem 0;
      color: var(--subtext);
      font-size: 0.95rem;
    }
    .category-filters, .dashboard-tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .filter-btn, .add-item-btn, .tab-btn, .live-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--subtext);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active, .tab-btn.active {
      background: var(--primary);
      color: #0b0f19;
      border-color: var(--primary);
    }
    .live-toggle-btn.active {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent);
      border-color: var(--accent);
    }
    .add-item-btn {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }
    .add-item-btn:hover {
      background: rgba(16, 185, 129, 0.3);
    }
    
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.5rem;
    }
    @media (max-width: 768px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }
    }

    .cart-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .cart-item-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .item-icon {
      font-size: 1.6rem;
    }
    .item-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .item-name {
      font-weight: 600;
      font-size: 1.05rem;
    }
    .item-meta {
      font-size: 0.85rem;
      color: var(--subtext);
    }
    .item-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .qty-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px 8px;
      border-radius: 8px;
    }
    .btn-qty {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-qty:hover {
      background: var(--primary);
      color: #000;
    }
    .qty-val {
      font-weight: 600;
      min-width: 20px;
      text-align: center;
    }
    .line-total {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary);
      min-width: 60px;
      text-align: right;
    }
    .btn-remove {
      background: transparent;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.15s ease;
    }
    .btn-remove:hover {
      opacity: 1;
    }

    .order-summary-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .order-summary-card h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.25rem;
      color: var(--text);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      color: var(--subtext);
    }
    .summary-row.discount {
      color: var(--accent);
      font-weight: 600;
    }
    .summary-row.total {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }
    .summary-divider {
      height: 1px;
      background: var(--card-border);
      margin: 0.25rem 0;
    }
    .shipping-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 0.5rem;
    }
    .shipping-section label {
      font-size: 0.85rem;
      color: var(--subtext);
    }
    .shipping-options {
      display: flex;
      gap: 8px;
    }
    .shipping-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--subtext);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .shipping-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }
    .promo-section {
      margin-top: 0.5rem;
    }
    .promo-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed var(--subtext);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .promo-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Dashboard Styles */
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 6px;
    }
    .status-badge.healthy {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-badge.degraded {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .metric-card-header h3 {
      margin: 0;
      font-size: 0.95rem;
      color: var(--subtext);
    }
    .metric-card-header .subtitle {
      font-size: 0.75rem;
      color: var(--primary);
      font-weight: bold;
    }
    .metric-value {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .metric-value .num {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text);
    }
    .metric-value .unit {
      font-size: 0.9rem;
      color: var(--subtext);
    }

    .logs-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
    }
    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .logs-header h3 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--text);
    }
    .btn-clear {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .logs-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
    }
    .log-item {
      font-family: monospace;
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      gap: 12px;
    }
    .log-item.info { color: #38bdf8; }
    .log-item.warn { color: #f59e0b; }
    .log-item.error { color: #f87171; }

    /* Wizard Styles */
    .wizard-app-container {
      width: 100%;
      max-width: 680px;
    }
    .wizard-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .wizard-header h1 {
      color: var(--primary);
      margin: 0 0 0.5rem 0;
    }
    .wizard-progress-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      position: relative;
    }
    .progress-step {
      flex: 1;
      text-align: center;
      padding: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--subtext);
      font-weight: 600;
      font-size: 0.85rem;
    }
    .progress-step:first-child { border-radius: 8px 0 0 8px; }
    .progress-step:last-child { border-radius: 0 8px 8px 0; }
    .progress-step.active {
      background: var(--primary);
      color: #0b0f19;
      border-color: var(--primary);
    }
    .step-card, .wizard-status-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .wizard-status-card {
      text-align: center;
      align-items: center;
      padding: 3rem 2rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .form-group label {
      font-size: 0.85rem;
      color: var(--subtext);
      font-weight: 600;
    }
    .form-group input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .step-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 1rem;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn.primary { background: var(--primary); color: #0b0f19; }
    .btn.secondary { background: rgba(255,255,255,0.1); color: var(--text); }
    .btn.success { background: var(--accent); color: #0b0f19; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .review-section {
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1rem;
    }
    .review-section h3 { margin: 0 0 0.5rem 0; font-size: 1rem; color: var(--primary); }
    .review-section p { margin: 4px 0; color: var(--subtext); font-size: 0.9rem; }

    /* Music Player Styles */
    .music-app {
      width: 100%;
      max-width: 860px;
    }
    .music-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .music-header h1 { color: var(--primary); margin: 0 0 0.4rem 0; }
    .music-subtitle { color: var(--subtext); font-size: 0.9rem; margin: 0; }
    .music-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    .music-left { display: flex; flex-direction: column; gap: 1rem; }
    .now-playing-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .track-art {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e3a5f, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .art-emoji { font-size: 2rem; }
    .track-meta { flex: 1; min-width: 0; }
    .track-title {
      margin: 0 0 0.2rem 0;
      font-size: 1.1rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      margin: 0 0 0.4rem 0;
      font-size: 0.85rem;
      color: var(--subtext);
    }
    .track-duration {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-bottom: 0.5rem;
    }
    .play-pause-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #0b0f19;
      font-size: 1.2rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .play-pause-btn:hover { background: var(--primary-hover); }
    .player-controls {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
    }
    .ctrl-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.12); }
    .ctrl-btn.primary-ctrl {
      width: 52px;
      height: 52px;
      background: var(--primary);
      color: #0b0f19;
      border: none;
      font-size: 1.25rem;
    }
    .ctrl-btn.primary-ctrl:hover { background: var(--primary-hover); }
    .volume-control {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .volume-icon { font-size: 1.25rem; flex-shrink: 0; }
    .volume-slider {
      flex: 1;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .volume-value { font-size: 0.85rem; color: var(--subtext); width: 36px; text-align: right; flex-shrink: 0; }
    .track-list {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.25rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .track-list-heading {
      margin: 0 0 0.75rem 0;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--subtext);
    }
    .track-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .track-item:hover { background: rgba(255,255,255,0.05); }
    .track-item.active { background: rgba(56, 189, 248, 0.12); }
    .track-indicator {
      width: 20px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--subtext);
      flex-shrink: 0;
    }
    .track-item.active .track-indicator { color: var(--primary); font-size: 0.9rem; }
    .track-item-meta { flex: 1; min-width: 0; }
    .track-item-title {
      display: block;
      font-size: 0.9rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-item.active .track-item-title { color: var(--primary); }
    .track-item-artist {
      display: block;
      font-size: 0.78rem;
      color: var(--subtext);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-item-duration { font-size: 0.8rem; color: var(--subtext); flex-shrink: 0; }

    /* Incident Composition Board */
    .incident-board {
      width: min(1180px, 100%);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .incident-board-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 2rem;
      padding: 1.5rem;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      background:
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.15), transparent 38%),
        linear-gradient(145deg, #151c2c, #101624);
    }
    .incident-eyebrow {
      margin: 0 0 0.45rem;
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .incident-board-header h1,
    .incident-maintenance h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.65rem);
      letter-spacing: -0.04em;
    }
    .incident-board-subtitle {
      max-width: 650px;
      margin: 0.65rem 0 0;
      color: var(--subtext);
      line-height: 1.6;
    }
    .incident-board-status {
      min-width: 210px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.55rem;
      color: var(--subtext);
      font-size: 0.82rem;
    }
    .incident-board-status strong {
      color: var(--text);
      font-size: 1rem;
    }
    .incident-live-dot {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #6ee7b7;
      font-weight: 700;
    }
    .incident-live-dot::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.12);
      content: "";
    }
    .incident-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }
    .incident-actions button,
    .incident-maintenance button {
      padding: 0.65rem 0.95rem;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--subtext);
      font-weight: 750;
      cursor: pointer;
    }
    .incident-actions button:hover {
      border-color: rgba(56, 189, 248, 0.45);
      color: var(--text);
    }
    .incident-actions button.active {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.16);
      color: var(--primary);
    }
    .incident-feature-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }
    .incident-feature-strip span {
      padding: 0.35rem 0.65rem;
      border: 1px solid var(--card-border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--subtext);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
    }
    .incident-service-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      align-items: start;
    }
    .incident-service-card {
      min-width: 0;
      padding: 1rem;
      border: 1px solid var(--card-border);
      border-top: 3px solid var(--accent);
      border-radius: 16px;
      background: var(--card-bg);
      color: var(--subtext);
      font-size: 0.83rem;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.16);
    }
    .incident-service-card.degraded { border-top-color: var(--warning); }
    .incident-service-card.critical { border-top-color: var(--danger); }
    .incident-service-header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.9rem;
    }
    .incident-service-header > div {
      min-width: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 0.55rem;
      align-items: center;
    }
    .incident-service-index {
      grid-row: 1 / span 2;
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      font-weight: 850;
    }
    .incident-service-header h2 {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 1rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .incident-service-header p {
      margin: 0.18rem 0 0;
      color: var(--subtext);
      font-size: 0.72rem;
    }
    .incident-health {
      align-self: flex-start;
      padding: 0.28rem 0.45rem;
